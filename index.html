<style>
:root{
  --bg:#F1F2F3; --surface:#FFFFFF; --surface-2:#F6F7F7; --ink:#1C1E21; --ink-2:#3B3E43; --muted:#73787F;
  --line:#DEE0E3; --line-strong:#C2C5CA; --btn-bg:#232629; --btn-ink:#FFFFFF;
  --wall:#E7E8EA; --floor:#D3D5D8; --dim:#5E636A; --sel:#1C1E21; --stage:#EBECEE; --grid:rgba(28,30,33,.05);
  --f-display:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  --f-ui:'Instrument Sans','Helvetica Neue',Arial,system-ui,sans-serif;
  --hdr:64px; --flow:48px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161719; --surface:#1D1F22; --surface-2:#232529; --ink:#ECEDEE; --ink-2:#C6C9CD; --muted:#8B9097;
    --line:#2F3236; --line-strong:#44484E; --btn-bg:#E8E9EB; --btn-ink:#161719;
    --wall:#25272B; --floor:#1A1B1E; --dim:#9AA0A7; --sel:#F3F4F5; --stage:#1A1C1E; --grid:rgba(255,255,255,.035);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161719; --surface:#1D1F22; --surface-2:#232529; --ink:#ECEDEE; --ink-2:#C6C9CD; --muted:#8B9097;
  --line:#2F3236; --line-strong:#44484E; --btn-bg:#E8E9EB; --btn-ink:#161719;
  --wall:#25272B; --floor:#1A1B1E; --dim:#9AA0A7; --sel:#F3F4F5; --stage:#1A1C1E; --grid:rgba(255,255,255,.035);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img,svg{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--hdr);display:flex;align-items:center;gap:20px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(10px)){.hdr{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}}
.brand{display:flex;align-items:center;gap:12px;min-height:44px}
.brand-mark{width:28px;height:28px;flex:none}
.wordmark{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.34em;white-space:nowrap}
.beta-tag{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.04em;color:#8A5A00;background:#FFF1D1;border:1px solid #E9C779;border-radius:999px;padding:2px 8px;white-space:nowrap}
@media (max-width:480px){.beta-tag{font-size:10px;padding:1px 6px}.beta-tag .bt-x{display:none}.hdr .brand{gap:8px}.hdr .wordmark{letter-spacing:.14em}}
.brand-sub{font-size:12px;color:var(--muted);padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav-link{min-height:44px;padding:0 14px;font-size:14px;white-space:nowrap;color:var(--ink-2);position:relative}
.nav-link[aria-current="page"]{color:var(--ink)}
.nav-link[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:var(--ink)}
.nav-link.subtle{color:var(--muted)}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--surface);flex:none}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 20px;border-radius:3px;font-weight:500;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background-color .15s,border-color .15s,opacity .15s}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn-primary:hover{opacity:.9}
.btn-ghost{border-color:var(--line-strong);background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-lg{min-height:56px;padding:0 30px;font-size:15px}
.btn-sm{min-height:40px;padding:0 14px;font-size:13px}
.btn-danger{color:#B4332B;border-color:color-mix(in srgb,#B4332B 40%,transparent)}
.btn[disabled]{opacity:.4;pointer-events:none}
.linkish{text-decoration:underline;text-underline-offset:3px;font-size:13px;color:var(--ink-2);min-height:36px}

/* ---------- home ---------- */
.home{min-height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.hero{flex:1;display:grid;grid-template-columns:minmax(300px,5fr) 8fr;gap:48px;align-items:center;padding:56px 48px 32px;max-width:1560px;width:100%;margin:0 auto}
.hero-title{font-family:var(--f-display);font-weight:300;font-size:clamp(50px,7.2vw,116px);line-height:.9;letter-spacing:.045em;margin:0 0 30px}
.hero-title span{display:block}
.lede{max-width:38ch;color:var(--ink-2);font-size:17px;line-height:1.55;margin:0 0 36px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.hero-visual{position:relative;min-width:0}
.hero-visual svg{display:block;width:100%;height:auto}
.hero-caption{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted);margin-top:10px;padding:0 4px}
.home-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:18px 48px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* ---------- flow strip ---------- */
.flow{display:flex;align-items:center;gap:6px;height:var(--flow);padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;scrollbar-width:none}
.flow::-webkit-scrollbar{display:none}
.flow-step{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.flow-step b{display:grid;place-items:center;width:22px;height:22px;border:1px solid var(--line-strong);border-radius:50%;font-weight:500;font-size:11px;font-family:var(--f-display)}
.flow-step[aria-current="step"]{color:var(--ink)}
.flow-step[aria-current="step"] b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flow-step.done b{border-color:var(--ink);color:var(--ink)}
.flow-sep{width:28px;height:1px;background:var(--line-strong);flex:none}

/* ---------- finish screen ---------- */
.finish{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:44px;padding:36px 40px 140px;max-width:1560px;margin:0 auto}
.finish-preview{position:sticky;top:calc(var(--hdr) + var(--flow) + 28px);align-self:start}
.swatch-hero{position:relative;aspect-ratio:5/4;overflow:hidden;border-radius:3px;background:var(--stage)}
.swatch-hero svg{position:absolute;inset:0;width:100%;height:100%}
.finish-meta{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-top:20px}
.finish-name{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 6px}
.finish-sub{font-size:14px;color:var(--muted)}
.finish-unit{width:150px;height:150px;background:var(--stage);border-radius:3px;display:grid;place-items:center}
.finish-unit svg{width:100%;height:100%}
.sec-title{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:0 0 8px}
.sec-lede{color:var(--muted);margin:0 0 22px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{min-height:40px;padding:0 16px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.mat-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative;transition:border-color .15s}
.mat-card:hover{border-color:var(--line-strong)}
.mat-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mat-card .sw{aspect-ratio:1/1.05;position:relative}
.mat-card .sw svg{position:absolute;inset:0;width:100%;height:100%}
.mat-card .meta{padding:12px 14px 14px}
.mat-card .nm{font-weight:500;font-size:14px}
.mat-card .cd{font-size:12px;color:var(--muted)}
.tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tick .icon{width:15px;height:15px;stroke-width:2.2}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:20px;padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.actionbar .grow{flex:1;min-width:0}
.mini-sw{width:44px;height:44px;border-radius:3px;overflow:hidden;flex:none;border:1px solid var(--line)}
.mini-sw svg{width:100%;height:100%;display:block}
.ab-info{display:flex;align-items:center;gap:14px;min-width:0}
.ab-info .t{font-size:12px;color:var(--muted)}
.ab-info .v{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:304px minmax(0,1fr) 344px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"lib stage cfg" "sum sum sum";height:calc(100dvh - var(--hdr) - var(--flow) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px}
.lib-pane{grid-area:lib;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pane-head{padding:18px 18px 12px}
.pane-title{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 12px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.seg button{flex:1;text-align:center;min-height:40px;font-size:13px;border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg small{opacity:.6;margin-left:4px}
.lib-list{flex:1;overflow:auto;padding:4px 18px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.u-card{background:var(--surface);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;transition:border-color .15s}
.u-card:hover{border-color:var(--line-strong)}
.u-vis{display:block;width:100%;height:150px;background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border-bottom:1px solid var(--line);position:relative}
.u-vis svg{width:100%;height:100%;display:block}
.u-vis .wtag{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted)}
.u-info{padding:12px 14px 4px}
.u-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.u-code{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.03em}
.u-price{font-size:14px;font-weight:500}
.u-name{font-size:13px;color:var(--ink-2);margin-top:2px}
.u-dims{font-size:12px;color:var(--muted);margin-top:2px}
.u-add{margin:10px 14px 14px;min-height:42px;border:1px solid var(--line-strong);border-radius:3px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.u-add:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.u-add .icon{width:16px;height:16px}
.u-group{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:2px}
.w-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px;padding:8px 14px 0}
.w-chip{min-height:38px;border:1px solid var(--line);border-radius:3px;font-size:12px;font-variant-numeric:tabular-nums;text-align:center}
.w-chip:hover{border-color:var(--line-strong)}
.w-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.w-chip.nofit{color:var(--muted);opacity:.5}
.d-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sheet-vis img{width:100%;display:block;border-radius:3px}

.stage-pane{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
.stage-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.name-in{flex:1 1 160px;min-width:0;min-height:44px;border:1px solid transparent;border-radius:3px;background:transparent;padding:0 10px;font-family:var(--f-display);font-size:18px;font-weight:400}
.name-in:hover{border-color:var(--line)}
.name-in:focus{border-color:var(--line-strong);outline:none}
.finish-pill{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 14px 4px 4px;border:1px solid var(--line);border-radius:3px;font-size:13px}
.finish-pill:hover{border-color:var(--line-strong)}
.finish-pill .mini-sw{width:34px;height:34px}
.finish-pill small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.stage{flex:1;position:relative;overflow:auto;min-height:0}
.stage svg.elev{display:block;width:100%;height:100%}
.stage-empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;max-width:340px;padding:20px;pointer-events:none}
.stage-empty h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 6px}
.stage-empty p{margin:0;color:var(--muted);font-size:14px}
.quick{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);white-space:nowrap;max-width:calc(100% - 24px)}
.quick .q-code{font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.03em;margin-right:6px}
.quick .icon-btn{border-color:transparent;background:transparent}
.quick .icon-btn:hover{background:var(--surface-2)}
.stage-wrap{position:relative;flex:1;min-height:0;display:flex}

.cfg-pane{grid-area:cfg;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;text-align:center;min-height:52px;font-size:14px;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--ink)}
.cfg-body{flex:1;overflow:auto;min-height:0}
.cfg-sec{padding:20px 20px 22px;border-bottom:1px solid var(--line)}
.cfg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 14px}
.cfg-h h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0}
.cfg-h span{font-size:12px;color:var(--muted)}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mm{display:flex;align-items:center;gap:10px;min-height:52px;padding:5px;border:1px solid var(--line);border-radius:3px;text-align:left;min-width:0}
.mm:hover{border-color:var(--line-strong)}
.mm[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mm .mini-sw{width:40px;height:40px;border:0}
.mm .t{min-width:0}
.mm .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .t small{display:block;font-size:11px;color:var(--muted)}
.mm.kit{grid-column:1/-1}
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.h-card{border:1px solid var(--line);border-radius:3px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.h-card:hover{border-color:var(--line-strong)}
.h-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.h-card .hv{height:74px;background:var(--stage)}
.h-card .hv svg{width:100%;height:100%;display:block}
.h-card .t{padding:8px 10px 10px}
.h-card b{display:block;font-weight:500;font-size:13px}
.h-card small{display:block;font-size:11px;color:var(--muted)}
.ct-list{display:flex;flex-direction:column;gap:8px}
.ct-card{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;min-height:54px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:3px;text-align:left}
.ct-card:hover{border-color:var(--line-strong)}
.ct-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ct-card .slab{height:42px;border-radius:2px;overflow:hidden}
.ct-card .slab svg{width:100%;height:100%;display:block}
.ct-card b{font-weight:500;font-size:13px;display:block}
.ct-card small{font-size:11px;color:var(--muted)}
.ct-card .p{font-size:12px;color:var(--muted);white-space:nowrap}
.acc{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left;padding:4px 0;font-size:13px}
.acc .box{width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:3px;display:grid;place-items:center;flex:none}
.acc[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acc .box .icon{width:14px;height:14px;stroke-width:2.4}
.acc .g{flex:1}
.acc .p{color:var(--muted);white-space:nowrap}
.unit-hero{background:var(--stage);height:200px;border-radius:3px;margin-bottom:16px}
.unit-hero svg{width:100%;height:100%;display:block}
.unit-title{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:.03em;margin:0}
.unit-sub{color:var(--ink-2);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin-top:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.act-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;border:1px solid var(--line);border-radius:3px;font-size:12px}
.act:hover{border-color:var(--line-strong);background:var(--surface-2)}
.act[disabled]{opacity:.35;pointer-events:none}
.act.danger{color:#B4332B}
.empty-cfg{padding:40px 24px;text-align:center;color:var(--muted)}
.empty-cfg h3{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:20px;margin:0 0 6px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}

.price-rows{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px;margin:0}
.price-rows dt{color:var(--ink-2)}
.price-rows dt small{display:block;color:var(--muted);font-size:12px}
.price-rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.price-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);margin-top:14px;padding-top:12px}
.price-total span{font-size:13px;color:var(--muted)}
.price-total b{font-family:var(--f-display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}

.sum-bar{grid-area:sum;display:flex;align-items:center;gap:24px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line);min-width:0}
.sum-chips{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:thin;padding:2px 0}
.sum-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:3px;font-size:12px;white-space:nowrap}
.sum-chip b{font-family:var(--f-display);font-weight:500;letter-spacing:.03em}
.metric{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
.metric span{font-size:11px;color:var(--muted)}
.metric b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.sum-actions{display:flex;gap:8px}

/* ---------- elevation svg ---------- */
.u-g{cursor:pointer}
.u-g .u-hov{opacity:0;transition:opacity .15s}
.u-g:hover .u-hov{opacity:.5}
.u-enter{animation:uenter .5s cubic-bezier(.2,.75,.25,1) both;transform-box:fill-box;transform-origin:50% 100%}
.hero-in{animation:uenter .75s cubic-bezier(.2,.75,.25,1) both;transform-box:fill-box;transform-origin:50% 100%}
.fade-late{animation:fadein .8s 1.1s both}
@keyframes uenter{from{opacity:0;transform:translateY(-5%)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dim-l{stroke:var(--dim)}
.dim-t{fill:var(--dim);font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.dim-t.on{fill:var(--ink);font-weight:600}
.sel-r{stroke:var(--sel);fill:none}
.ghost{stroke:var(--line-strong);fill:none}

/* ---------- my designs ---------- */
.page{max-width:1400px;margin:0 auto;padding:40px 40px 80px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.page-head h1{font-family:var(--f-display);font-weight:300;font-size:44px;line-height:1;margin:0 0 8px;letter-spacing:.02em}
.page-head p{margin:0;color:var(--muted)}
.d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.d-card{background:var(--surface);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column}
.d-thumb{background:var(--stage);border-bottom:1px solid var(--line);aspect-ratio:16/9;display:flex}
.d-thumb svg{width:100%;height:100%;display:block}
.d-body{padding:16px 18px;flex:1}
.d-body h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0 0 4px}
.d-facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.d-price{font-family:var(--f-display);font-weight:500;font-size:20px;margin-top:10px}
.d-actions{display:flex;gap:8px;padding:0 18px 18px}
.empty{border:1px dashed var(--line-strong);border-radius:3px;padding:56px 24px;text-align:center}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 auto 22px;max-width:46ch}

/* ---------- admin ---------- */
.admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.admin-tabs button{min-height:48px;padding:0 16px;font-size:14px;color:var(--muted);position:relative;white-space:nowrap}
.admin-tabs button[aria-selected="true"]{color:var(--ink);font-weight:500}
.admin-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--ink)}
.admin-tabs small{color:var(--muted);font-weight:400;margin-left:4px}
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.rows-head,.row{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:10px 16px}
.rows-head{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2);min-height:40px}
.row{border-bottom:1px solid var(--line);font-size:13px;min-height:68px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
.row .th{width:56px;height:52px;background:var(--stage);border-radius:2px;overflow:hidden}
.row .th svg{width:100%;height:100%;display:block}
.row b{font-weight:500;display:block}
.row small{color:var(--muted);display:block}
.status{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px}
.status i{width:7px;height:7px;border-radius:50%;background:#3E9B62}
.status.draft i{background:#B9A04A}
.data-panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;position:sticky;top:calc(var(--hdr) + 20px)}
.data-panel h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}
.data-panel pre{margin:0;padding:16px 18px;font-size:12px;line-height:1.55;overflow:auto;max-height:52vh;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.data-panel p{margin:0;padding:0 18px 16px;font-size:12px;color:var(--muted)}
.col-hide{}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(12,13,15,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s both}
.modal{background:var(--surface);color:var(--ink);border-radius:4px;width:min(100%,560px);max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:modalin .28s cubic-bezier(.2,.75,.25,1) both}
.modal.wide{width:min(100%,1080px)}
@keyframes modalin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 24px 6px}
.modal-head h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.modal-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.modal-body{padding:16px 24px 24px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:16px 24px 22px;border-top:1px solid var(--line)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.frm .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px}
.fld span{color:var(--ink-2);font-weight:500}
.fld input,.fld select,.fld textarea{min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);font-size:15px;width:100%}
.fld input[type=color]{padding:4px;height:46px}
.fld textarea{min-height:90px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.fld .err{color:#B4332B;font-size:12px;font-weight:400}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:3px;font-size:13px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--ink)}
.radio-row{display:flex;flex-wrap:wrap;gap:8px}
.radio-row label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:3px;font-size:14px;cursor:pointer}
.radio-row input{accent-color:var(--ink);width:18px;height:18px}

/* summary sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:0}
.sheet-vis{background:var(--stage);padding:24px;display:flex;flex-direction:column;justify-content:center;min-height:320px;border-right:1px solid var(--line)}
.sheet-vis svg{width:100%;height:auto;display:block}
.sheet-doc{padding:26px 28px}
.sheet-brand{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sheet-brand .wordmark{font-size:13px}
.sheet-doc h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 18px}
.spec{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;font-size:14px;margin:0 0 18px}
.spec dt{color:var(--muted)}
.spec dd{margin:0}
.unit-lines{list-style:none;margin:0;padding:0;font-size:14px}
.unit-lines li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.unit-lines b{font-family:var(--f-display);font-weight:500;letter-spacing:.03em}
.unit-lines .q{color:var(--muted)}
.unit-lines .p{font-variant-numeric:tabular-nums}
.sheet-total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0 4px;border-top:2px solid var(--ink);margin-top:16px}
.sheet-total b{font-family:var(--f-display);font-weight:500;font-size:32px;font-variant-numeric:tabular-nums}
.disclaimer{font-size:12px;color:var(--muted);margin:10px 0 0}
.success{text-align:center;padding:16px 8px 8px}
.success .ring{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;margin:0 auto 16px}
.success .ring .icon{width:28px;height:28px;stroke-width:1.8}
.success h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 6px}
.ref{display:inline-block;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.06em;border:1px solid var(--line-strong);padding:8px 16px;border-radius:3px;margin:12px 0}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--hdr) + 14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:var(--btn-bg);color:var(--btn-ink);padding:12px 18px;border-radius:3px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:toastin .25s both}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
/* shape step */
.shape-screen{max-width:1200px;margin:0 auto;padding:36px 40px 150px}
.shape-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:40px;align-items:start}
.shape-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;text-align:left;overflow:hidden;transition:border-color .15s}
.shape-card:hover{border-color:var(--line-strong)}
.shape-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.shape-vis{height:220px;background:var(--stage);padding:14px;display:flex;min-height:0}
.shape-vis svg{width:100%;height:100%;display:block;min-height:0}
.shape-meta{padding:14px 16px 16px}
.shape-meta b{display:block;font-family:var(--f-display);font-weight:500;font-size:20px}
.shape-meta small{color:var(--muted);font-size:13px}
.dims{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.3fr);gap:36px;align-items:start;border-top:1px solid var(--line);padding-top:32px}
.wall-inputs{display:grid;gap:16px;max-width:360px}
.mm-in{position:relative}
.mm-in input{padding-right:54px !important;font-size:18px !important;font-variant-numeric:tabular-nums}
.mm-in em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);pointer-events:none}
.dims-plan{background:var(--stage);border-radius:3px;height:380px;padding:16px;display:flex;min-height:0}
.dims-plan svg{width:100%;height:100%;display:block;min-height:0}
/* wall bar in builder */
.wall-bar{display:flex;align-items:stretch;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.wall-bar::-webkit-scrollbar{display:none}
.plan-btn{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:3px;font-size:13px;flex:none;min-height:52px;text-align:left}
.plan-btn:hover{border-color:var(--line-strong)}
.plan-btn svg{width:56px;height:44px;display:block}
.plan-btn small{display:block;color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:2px}
.wall-tabs{display:flex;gap:8px;flex:1}
.wall-tab{flex:1 1 0;min-width:150px;max-width:300px;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 10px;padding:8px 12px 9px;border:1px solid var(--line);border-radius:3px;text-align:left}
.wall-tab:hover{border-color:var(--line-strong)}
.wall-tab b{font-family:var(--f-display);font-weight:500;font-size:15px}
.wall-tab span{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.wall-tab i{grid-column:1/-1;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--ink) var(--p),var(--line) var(--p));margin-top:4px}
.wall-tab small{grid-column:1/-1;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wall-tab[aria-selected="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.wall-tab.over{border-color:#B4332B}
.wall-tab.over small{color:#B4332B}
.wall-tab.over i{background:#B4332B}
.metric.over b{color:#B4332B}
.u-card.nofit .u-vis{opacity:.45}
.u-card.nofit .u-add{color:var(--muted);border-style:dashed}
.u-vis img{width:100%;height:100%;object-fit:contain;display:block}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.toast.warn{background:var(--surface);color:var(--ink);border:1px solid #B4332B;border-left:4px solid #B4332B}
.toast b{display:block;font-weight:500}
.toast small{display:block;opacity:.75;font-size:13px;margin-top:2px}
.sheet-vis figure{margin:0 0 16px}
.sheet-vis figure:last-child{margin-bottom:0}
.sheet-vis figcaption{font-size:12px;color:var(--muted);margin-bottom:4px}
.dp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-right:14px;border-bottom:1px solid var(--line)}
.dp-head h3{border-bottom:0 !important}
.json-box{width:100%;min-height:340px;padding:14px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface-2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:var(--ink)}
.img-pick{display:flex;align-items:center;gap:14px}
.img-prev{width:96px;height:72px;border:1px dashed var(--line-strong);border-radius:3px;display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden;flex:none}
.img-prev img{width:100%;height:100%;object-fit:contain}
.admin-note{font-size:13px;color:var(--ink-2);margin:-8px 0 18px}
/* views + openings */
.view-tab{flex:0 0 auto;min-width:118px}
.view-tab b{font-size:14px}
.stage-top svg{display:block;width:100%;height:100%}
.stage-3d{position:relative;overflow:hidden}
.v3d-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.v3d-canvas:active{cursor:grabbing}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.view-note{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:3px;pointer-events:none;max-width:calc(100% - 150px)}
.view-btn{position:absolute;right:12px;bottom:10px}
.view-note.warn{border-color:#B4332B;border-left:4px solid #B4332B;color:var(--ink)}
.op-g{cursor:grab;touch-action:none}
.op-g:active{cursor:grabbing}
.q-pos{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 6px;white-space:nowrap}
.q-pos input{width:84px;min-height:38px;border:1px solid var(--line-strong);border-radius:3px;padding:0 8px;background:var(--surface);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.q-pos input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.op-range{font-size:12px;color:var(--muted);margin:-6px 0 0}
@media (max-width:640px){.q-pos small{display:none}.q-pos{margin:0 2px}.q-pos input{width:70px}}
.op-g:hover rect.op-frame{stroke-opacity:.7}
.op-prev{background:var(--stage);border-radius:3px;height:170px;padding:10px;display:flex}
.op-prev svg{width:100%;height:100%;display:block}
.top-t{fill:var(--ink);font-family:var(--f-display);font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.top-wl{fill:var(--dim);font-family:var(--f-ui)}
/* render kitchen */
.btn-render{background:linear-gradient(135deg,#3D4045,#1A1C1F);color:#fff;border-color:#1A1C1F;letter-spacing:.02em}
.btn-render:hover{opacity:.92}
.btn-render .icon{width:17px;height:17px}
.mm-group{font-size:12px;font-weight:500;color:var(--muted);margin:16px 0 8px}
.mm-group:first-child{margin-top:0}
.mat-group-h{font-family:var(--f-display);font-weight:500;font-size:18px;margin:26px 0 12px}
.mat-group-h:first-of-type{margin-top:0}
.rv{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:#141517;color:#ECEDEE;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fadein .25s both}
.rv-top{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid #2A2C30}
.rv-brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.rv-brand .wordmark{font-size:11px;display:block;color:#9A9FA6}
.rv-brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-views{display:flex;border:1px solid #3A3D42;border-radius:3px;overflow:hidden}
.rv-views button{min-height:42px;min-width:76px;padding:0 14px;font-size:13px;color:#C9CCD0;text-align:center}
.rv-views button[aria-pressed="true"]{background:#ECEDEE;color:#141517;font-weight:500}
.rv-close{width:44px;height:44px;display:grid;place-items:center;border:1px solid #3A3D42;border-radius:3px;flex:none}
.rv-stage{position:relative;flex:1;min-height:0;margin:14px 18px 0;border-radius:4px;overflow:hidden;background:#E7E5E1}
.rv-host{position:absolute;inset:0}

.rv-refine{position:absolute;right:12px;top:12px;font-size:12px;color:#3B3E43;background:rgba(255,255,255,.82);padding:6px 10px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .2s}
.rv.refining .rv-refine{opacity:1}
.rv-acc{display:block;width:100%;height:100%}

.rv-mats{display:flex;gap:18px;overflow-x:auto;min-width:0;flex:1 1 380px;scrollbar-width:none}
.rv-mats::-webkit-scrollbar{display:none}
.rv-group{display:flex;align-items:center;gap:6px;flex:none}
.rv-group > span{font-size:12px;color:#8C9198;margin-right:4px}
.rv-sw{width:44px;height:44px;border-radius:50%;padding:3px;border:1.5px solid transparent;flex:none}
.rv-sw[aria-pressed="true"]{border-color:#ECEDEE}
.rv-sw .mini-sw{width:100%;height:100%;border-radius:50%;border:0}

.rv-spec small{color:#9A9FA6;font-size:12px}
.rv-total small{display:block;font-size:11px;color:#9A9FA6}
.rv-total b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.rv-actions{display:flex;gap:8px;margin-left:auto}
.rv-ghost{border:1px solid #4A4D52;color:#ECEDEE}
.rv-ghost:hover{background:#1F2124}
.rv-primary{background:#ECEDEE;color:#141517}
@media (max-width:760px){

  .rv-views{order:3;width:100%}

  .rv-bottom{gap:12px;padding:12px}

  .rv-mats{flex-basis:100%}
  .rv-actions{width:100%}

}
/* ===== Unit library (product cards) ===== */
:root{--f-ar:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif}
.lib2{display:flex;flex-direction:column;height:100%;min-height:0;font-family:var(--f-ar)}
.lib2-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.lib2-top{display:flex;align-items:center;gap:8px}
.lib2-title{font-weight:600;font-size:18px;margin:0}
.lvl{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:12px}
.lvl button{flex:1;min-height:38px;border-radius:999px;font-size:14px;text-align:center;color:var(--ink-2)}
.lvl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cats,.wfs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:12px}
.cats::-webkit-scrollbar,.wfs::-webkit-scrollbar{display:none}
.cat{min-height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;font-size:14px;flex:none;display:inline-flex;align-items:center;gap:6px}
.cat:hover{border-color:var(--line-strong)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat .icon{width:15px;height:15px}
.wfs{padding-top:8px}
.cats{flex-wrap:wrap;overflow:visible}
.wf{min-height:32px;padding:0 11px;border-radius:6px;font-size:12px;color:var(--ink-2);flex:none;border:1px solid transparent;font-variant-numeric:tabular-nums}
.wf.nofit{opacity:.38;text-decoration:line-through}
.lib2-space{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.lib2-space b{font-weight:600;font-variant-numeric:tabular-nums}
.lib2-space small{color:var(--muted);font-size:11.5px}
.wf[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.lib2-grid{flex:1;overflow:auto;padding:14px 16px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start;grid-auto-rows:max-content;min-height:0}
.pc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pc:hover{border-color:var(--line-strong);box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.pc-main{display:block;width:100%;text-align:right;padding:0}
.pc-vis{aspect-ratio:1/.92;background:radial-gradient(ellipse at 50% 38%,#FBFBFA 0%,#EEEEEC 72%);display:grid;place-items:center;overflow:hidden;cursor:grab;touch-action:pan-y}
.pc-vis img,.pc-vis svg{width:100%;height:100%;display:block;object-fit:contain}
.pc-vis img{animation:fadein .35s both}
.pc-body{padding:10px 12px 0}
.pc-name{font-weight:500;font-size:14px;line-height:1.35}
.pc-w{font-size:12px;color:var(--muted);margin-top:1px}
.pc-price{font-family:var(--f-display);font-size:18px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.pc-add{margin:10px 12px 12px;min-height:42px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.pc-add:hover{opacity:.9}
.pc-pend{font-family:var(--f-ar);font-size:14px;font-weight:500;color:#8A6D3B}
.pc.nofit{opacity:.62}
.pc.nofit .pc-add{background:var(--surface-2);color:var(--ink-2)}
.pc-fav{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#3B3E43;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pc-fav[aria-pressed="true"]{color:#1C1E21}
.pc-fav[aria-pressed="true"] .icon{fill:currentColor}
.lib2-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.ud{font-family:var(--f-ar);padding:18px 22px 22px;position:relative}
.ud-x{position:absolute;top:12px;left:12px}
.ud-vis{aspect-ratio:1.2/1;background:radial-gradient(ellipse at 50% 38%,#FBFBFA 0%,#ECECEA 72%);border-radius:10px;display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
.ud-vis img,.ud-vis svg{width:100%;height:100%;object-fit:contain;display:block}
.ud-name{font-size:22px;font-weight:600;margin:0}
.ud-w{font-family:var(--f-display);font-size:20px;margin-top:2px}
.ud-d{font-size:14px;color:var(--ink-2);margin-top:2px}
.ud-p{font-family:var(--f-display);font-size:28px;font-weight:500;margin-top:10px;font-variant-numeric:tabular-nums}
.ud-act{display:flex;gap:8px;margin-top:16px}
.ud-act .pc-add{flex:1;margin:0;min-height:50px;font-size:15px}
.ud-act .vbtn{width:50px;height:50px}
@media (max-width:1180px){ .studio .lib-pane{width:min(400px,92vw)} }
/* ===== 3D studio ===== */
.studio{display:grid;grid-template-columns:372px minmax(0,1fr) 330px;height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;position:relative;overflow:hidden}
.studio .lib-pane,.studio .stage-pane,.studio .cfg-pane{grid-area:auto;min-height:0}
.studio .stage-pane{background:#E9E7E3;position:relative}
.studio .stage-wrap{position:relative;height:100%;display:flex}
.studio .stage{flex:1;min-width:0}
.studio .stage-top,.studio .stage-wall{background:var(--stage)}
.studio .lib-list{flex-direction:column;overflow-y:auto;overflow-x:hidden}
.studio .u-card{flex:none}
.studio .u-vis{touch-action:pan-y;cursor:grab}
.studio .cfg-body{overflow:auto}
.lib-hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.drawer-x{display:none;margin-left:auto}
.ov{position:absolute;z-index:6}

.vseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
.vseg button{min-height:40px;padding:0 14px;font-size:13px;color:var(--ink-2);text-align:center;border-right:1px solid var(--line)}
.vseg button:last-child{border-right:0}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vseg small{display:block;font-size:10px;opacity:.75;line-height:1.1}
.vbtn{width:42px;height:42px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.price-card{right:14px;top:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 16px 12px;min-width:220px;box-shadow:0 10px 30px -16px rgba(0,0,0,.4)}
.price-card .lbl{font-size:11px;letter-spacing:.08em;color:var(--muted)}

.pc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.ws-pill{border-radius:10px !important;line-height:1.35;left:50%;bottom:88px;transform:translateX(-50%);display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px)}
.ws-pill .over{color:#B4332B}
.toolbar{position:absolute;z-index:7;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 14px 34px -18px rgba(0,0,0,.45);max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;min-height:52px;padding:0 8px;border-radius:4px;font-size:11px;color:var(--ink-2);white-space:nowrap;flex:none}
.tb:hover{background:var(--surface-2)}

.tb .icon{width:19px;height:19px}

.tb-sep{width:1px;background:var(--line);margin:8px 3px;flex:none}
.only-narrow{display:none !important}
.sc-orient{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:10px}
.sc-olabel{font-size:12px;color:var(--muted);font-weight:500}
.sc-orient .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sc-orient .seg button{min-height:34px;border:0;background:transparent;font:500 12.5px/1 inherit;font-family:inherit;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 6px}

.sel-card.isl-card{max-height:calc(100% - 150px);overflow-y:auto;overscroll-behavior:contain}
.sel-card{left:14px;top:66px;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px 14px;box-shadow:0 12px 30px -16px rgba(0,0,0,.4)}
.sc-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500}
.sc-x{width:34px;height:34px;display:grid;place-items:center;margin:-6px -8px -6px 0}

.sc-act button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sc-act .danger{color:#B4332B}

/* =====================================================================
   UI refresh (Nov 2026): showroom palette, calmer hierarchy, consistent radii.
   A layer on top of the existing styles: same structure, same features.
   Stone surfaces, charcoal ink, one oak-brass accent for prices and the chosen state.
   ===================================================================== */
:root{
  --bg:#ECEAE6; --surface:#FBFAF8; --surface-2:#F3F1ED; --ink:#25282A; --ink-2:#45494C; --muted:#7A7D7F;
  --line:#E0DDD7; --line-strong:#C9C5BD; --btn-bg:#25282A; --btn-ink:#FBFAF8;
  --stage:#E9E7E2; --wall:#E3E0DA; --floor:#D6D2CA; --sel:#8E6B45;
  --brass:#8E6B45; --brass-soft:#F2EBE2; --r-panel:14px; --r-card:12px; --r-ctl:10px;
  --shadow-float:0 1px 2px rgba(37,40,42,.06), 0 12px 32px -14px rgba(37,40,42,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17191A; --surface:#1E2022; --surface-2:#25282A; --ink:#ECEBE8; --ink-2:#C9C7C2; --muted:#94938F;
    --line:#2E3133; --line-strong:#44474A; --btn-bg:#ECEBE8; --btn-ink:#17191A; --stage:#1B1D1F; --sel:#C9A47A;
    --brass:#C9A47A; --brass-soft:#2C2620;
  }
}
:root[data-theme="dark"]{
  --bg:#17191A; --surface:#1E2022; --surface-2:#25282A; --ink:#ECEBE8; --ink-2:#C9C7C2; --muted:#94938F;
  --line:#2E3133; --line-strong:#44474A; --btn-bg:#ECEBE8; --btn-ink:#17191A; --stage:#1B1D1F; --sel:#C9A47A;
  --brass:#C9A47A; --brass-soft:#2C2620;
}
/* header */
.hdr{border-bottom-color:var(--line)}
.wordmark{letter-spacing:.3em}
.brand-sub{color:var(--muted)}
.nav-link{border-radius:var(--r-ctl)}
.nav-link:hover{background:var(--surface-2)}
/* buttons and controls: one radius family */
.btn{border-radius:var(--r-ctl)}
.btn-render{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{border-radius:var(--r-ctl);border-color:var(--line)}
.seg button{border-right-color:var(--line)}
.w-chip{border-radius:8px;transition:border-color .12s}
.w-chip[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
/* library */
.lib2-head{padding:18px 18px 14px}
.lib2-title{font-size:19px;letter-spacing:0}
.lvl{background:var(--surface-2);border-color:var(--line)}
.lvl button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px -4px rgba(0,0,0,.18)}
.cat{min-height:36px;padding:0 14px;font-size:13.5px;background:var(--surface);border-color:var(--line);transition:border-color .12s,background-color .12s}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.wfs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
.wf{border-radius:999px;min-height:32px;padding:0 12px}
.wf[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.lib2-grid{gap:14px;padding:16px 18px 28px;background:var(--surface-2)}
.pc{border-radius:var(--r-card);border-color:var(--line);background:var(--surface)}
.pc:hover{border-color:var(--line-strong);box-shadow:0 14px 30px -22px rgba(37,40,42,.55)}
.pc-vis{background:radial-gradient(ellipse at 50% 36%,#FFFFFF 0%,#EFEDE9 74%)}
:root[data-theme="dark"] .pc-vis{background:radial-gradient(ellipse at 50% 36%,#F6F5F2 0%,#DEDBD5 74%)}
.pc-body{padding:12px 14px 0}
.pc-name{font-size:14.5px;font-weight:600;color:var(--ink)}
.pc-w{font-size:12.5px}
.pc-price{font-size:19px;color:var(--brass);margin-top:6px}
.pc-add{margin:12px 14px 14px;min-height:40px;border-radius:var(--r-ctl);background:transparent;color:var(--ink);border:1px solid var(--line-strong);font-weight:600;transition:background-color .12s,color .12s,border-color .12s}
.pc-add:hover{background:var(--ink);color:var(--surface);border-color:var(--ink);opacity:1}
.pc-fav{background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* stage overlays */
.studio .stage-pane{background:var(--stage)}
.price-card{border-radius:var(--r-panel);border:0;background:var(--ink);color:var(--surface);padding:16px 18px 14px;min-width:240px;box-shadow:var(--shadow-float)}
.price-card .lbl{letter-spacing:0;font-size:12.5px;color:color-mix(in srgb,var(--surface) 70%,transparent);font-weight:500}
.price-card b{font-size:30px;font-weight:500;letter-spacing:.01em;margin-top:2px;border-bottom:1px solid color-mix(in srgb,var(--brass) 70%,transparent);padding-bottom:8px;margin-bottom:8px}
.price-card small{color:color-mix(in srgb,var(--surface) 68%,transparent)}
.price-card .linkish{color:var(--surface)}
.price-card .btn-primary{background:var(--brass);color:#fff;border-color:var(--brass);border-radius:var(--r-ctl)}
:root[data-theme="dark"] .price-card .btn-primary{color:#17191A}
.toolbar{border-radius:16px;border-color:var(--line);box-shadow:var(--shadow-float);padding:6px;gap:3px}
.tb{border-radius:var(--r-ctl);font-size:11.5px;min-width:62px}
.tb:disabled{opacity:.38}
.tb-primary,.toolbar .btn-render{background:var(--ink);color:var(--surface)}
.sel-card{border-radius:var(--r-panel);border-color:var(--line);box-shadow:var(--shadow-float);padding:14px 16px 16px}
@media (min-width:641px){.sel-card{max-height:calc(100% - 160px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.sc-w{font-size:22px}
.sc-p{color:var(--brass);font-size:21px}
.sc-act button{border-radius:var(--r-ctl);transition:border-color .12s,background-color .12s}
.sc-act button:hover{background:var(--surface-2)}
.sc-act button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft)}
.sc-orient{padding-top:10px;border-top:1px solid var(--line)}
.sc-orient .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ws-pill{box-shadow:var(--shadow-float);border-color:var(--line) !important}
.stage-bar{background:var(--surface)}
/* right panel */
.cfg-pane{background:var(--surface)}
.tabs button[aria-selected="true"]::after{background:var(--brass);height:2px}
.cfg-h h3{font-size:16.5px;font-weight:500}
.cfg-sec{padding:22px 22px 24px}
@media (max-width:640px){
  .price-card{min-width:0;padding:9px 13px 9px;border-radius:12px}

/* ---- kitchen layout: base + tall share the floor line; wall units fill gaps above base runs ---- */
function layoutKitchen(design, onWall){
  const items = resolveItems(design, onWall);
  const ops = onWall ? (design.openings || []).filter(o => o.wall === onWall) : [];
  if(items.length && items.every(i => i.item.x != null)){
    // explicit positions (the 3D designer places every unit exactly)
    items.forEach(i => { i.x = i.item.x; });
    const floor = items.filter(i => cat(i.unit) !== 'wall' && cat(i.unit) !== 'hood').sort((a, b) => a.x - b.x);
    const wall = items.filter(i => cat(i.unit) === 'wall').sort((a, b) => a.x - b.x);
    const runs = []; let start = null, last = 0;
    floor.forEach(i => {
      if(cat(i.unit) === 'base'){ if(start !== null && Math.abs(i.x - last) > 1){ runs.push([start, last]); start = null; } if(start === null) start = i.x; last = i.x + i.unit.width; }
      else if(start !== null){ runs.push([start, last]); start = null; }
    });
    if(start !== null) runs.push([start, last]);
    const floorEnd = floor.length ? Math.max(...floor.map(i => i.x + i.unit.width)) : 0;
    const total = Math.max(0, ...items.map(i => i.x + i.unit.width));
    return {items, floor, wall, runs, ops, floorEnd, total, baseRun:runs.reduce((a, [p, q]) => a + (q - p), 0)};
  }
  // Units never pass through a window: a unit that would overlap one is placed just after it.
  const band = u => spanBand(u);
  const clearX = (u, x) => {
    const [b0, b1] = band(u);
    for(let n = 0; n < 20; n++){
      const hit = ops.find(o => b0 < winTop(o) && b1 > winSill(o) && x < o.left + o.width && x + u.width > o.left);
      if(!hit) break; x = hit.left + hit.width;
    }
    return x;
  };
  const floor = items.filter(i => cat(i.unit) !== 'wall');
  const wall = items.filter(i => cat(i.unit) === 'wall');
  let x = 0; floor.forEach(i => { i.x = clearX(i.unit, x); x = i.x + i.unit.width; });
  const floorEnd = x;
  const runs = []; let start = null, last = 0;
  floor.forEach(i => {
    if(cat(i.unit) === 'base'){
      if(start !== null && i.x !== last){ runs.push([start, last]); start = null; }
      if(start === null) start = i.x;
      last = i.x + i.unit.width;
    } else if(start !== null){ runs.push([start, last]); start = null; }
  });
  if(start !== null) runs.push([start, last]);
  let cur = 0, wallEnd = 0;
  wall.forEach(i => {
    const w = i.unit.width; let placed = false;
    for(const [a, b] of runs){ const s = clearX(i.unit, Math.max(a, cur)); if(s + w <= b){ i.x = s; cur = s + w; placed = true; break; } }
    if(!placed){ const s = clearX(i.unit, Math.max(cur, floorEnd)); i.x = s; cur = s + w; }
    wallEnd = Math.max(wallEnd, cur);
  });
  const baseRun = runs.reduce((a, [p, q]) => a + (q - p), 0);
  return {items, floor, wall, runs, ops, floorEnd, total:Math.max(floorEnd, wallEnd), baseRun};
}

function poly(pts, fill, extra=''){ return `<polygon points="${pts.map(p => p.map(r1).join(',')).join(' ')}" fill="${fill}" ${extra}/>`; }

<rect x="${r - 75}" y="0" width="150" height="700" fill="url(#g-steel)"/><ellipse cx="${r}" cy="700" rx="${r}" ry="${r * .32}" fill="#DADDE0"/>
<rect x="0" y="700" width="${u.width}" height="${bh}" fill="url(#g-steel)"/><ellipse cx="${r}" cy="${700 + bh}" rx="${r}" ry="${r * .32}" fill="#8F959B"/><ellipse cx="${r}" cy="${700 + bh}" rx="${r - 18}" ry="${(r - 18) * .32}" fill="#2A2C2F"/></svg>`;
  }
  mat = mat || CAT.materials[0]; h = h || CAT.handles[0]; ct = ct || CAT.countertops[0];
  const b = unitBox(u), w = u.width, isBase = cat(u) === 'base';
  const dx = u.depth * .42, dy = u.depth * .24;
  const box = VIS_BOX[cat(u)] || VIS_BOX.base;
  const vbW = Math.max(box[0], w + dx + 200), vbH = box[1];
  const ox = (vbW - (w + dx)) / 2;
  const bottom = b.plinth ? FLOOR : b.top + b.h;
  const vbY = bottom + 70 - vbH;
  const carB = b.top + b.h, mf = matFill(mat);
  let s = `<svg viewBox="${r1(-ox)} ${r1(vbY)} ${r1(vbW)} ${r1(vbH)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(u.name)} in ${esc(mat.name)}">`;
  if(b.plinth) s += `<ellipse cx="${r1(w/2+dx/2)}" cy="${r1(FLOOR-dy/2+6)}" rx="${r1((w+dx)*.62)}" ry="${r1(dy*.8)}" fill="#000" opacity=".14"/>`;
  else s += `<rect x="20" y="${r1(b.top+24)}" width="${w}" height="${b.h}" fill="#000" opacity=".1"/>`;
  s += poly([[w,b.top],[w+dx,b.top-dy],[w+dx,carB-dy],[w,carB]], mf) + poly([[w,b.top],[w+dx,b.top-dy],[w+dx,carB-dy],[w,carB]], '#000', 'opacity=".42"');
  if(b.plinth) s += poly([[w-24,carB],[w-24+dx*.86,carB-dy*.86],[w-24+dx*.86,FLOOR-dy*.86],[w-24,FLOOR]], '#1B1C1E');

    if(u.extras?.includes('sink')){

const PLAN_DEFAULTS = {single:{A:3200}, L:{A:3200, B:2400}, U:{A:3200, B:2400, C:3200}};

function ShapePlan(shape, walls, active, mode = 'card'){
  shape = SHAPES[shape] ? shape : 'single';
  const W = {...PLAN_DEFAULTS[shape]};
  if(walls) Object.keys(W).forEach(k => { const v = Number(walls[k]); if(v) W[k] = Math.min(12000, Math.max(600, v)); });
  const D = 600, segs = planWalls(shape, W);

  if(shape === 'single') maxY = Math.max(D * 2.4, W.A * .45);
  const span = Math.max(maxX, maxY);

  const fs = span * (mode === 'large' ? .05 : .085);
  let s = `<svg viewBox="${r1(-pad)} ${r1(-pad)} ${r1(maxX + pad*2)} ${r1(maxY + pad*2)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
  s += `<rect x="0" y="0" width="${r1(maxX)}" height="${r1(maxY)}" style="fill:var(--surface)" opacity=".85"/>`;
  segs.forEach(g => {

    const x = horiz ? Math.min(g.x1, g.x2) : (g.out[0] < 0 ? g.x1 : g.x1 - D);

    s += `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(horiz ? Math.abs(g.x2 - g.x1) : D)}" height="${r1(horiz ? D : Math.abs(g.y2 - g.y1))}" style="fill:${on ? 'var(--ink)' : 'var(--line-strong)'}" opacity="${on ? (active ? .6 : .3) : .7}"/>`;
  });

}

/* =====================================================================
   WHOLE-KITCHEN VIEWS — top view (SVG) and simple 3D (three.js, loaded on demand)
   Each wall has a frame: p0 = its left end when you face it, d = along the wall, n = into the room.
   ===================================================================== */
function wallFrames(shape, walls){
  const W = {A:3200, B:2400, C:3200}; Object.keys(W).forEach(k => { const v = Number(walls?.[k]); if(v > 0) W[k] = v; });
  if(shape === 'L') return {A:{p0:[0,0], d:[1,0], n:[0,1], len:W.A}, B:{p0:[0,W.B], d:[0,-1], n:[1,0], len:W.B}};
  if(shape === 'U') return {A:{p0:[0,W.A], d:[0,-1], n:[1,0], len:W.A}, B:{p0:[0,0], d:[1,0], n:[0,1], len:W.B}, C:{p0:[W.B,0], d:[0,1], n:[-1,0], len:W.C}};
  return {A:{p0:[0,0], d:[1,0], n:[0,1], len:W.A}};
}
const fpt = (f, x, z) => [f.p0[0] + f.d[0]*x + f.n[0]*z, f.p0[1] + f.d[1]*x + f.n[1]*z];

  let a = Math.atan2(f.d[1], f.d[0]) * 180 / Math.PI; if(a > 90) a -= 180; if(a <= -90) a += 180;
  return `<text class="${cls}" transform="translate(${r1(px)} ${r1(py)}) rotate(${r1(a)})" font-size="${r1(size)}" text-anchor="middle" dominant-baseline="central" stroke-width="${r1(size*.28)}">${label}</text>`;
}
const shadeHex = (hex, k) => '#' + rgb01(hex).map(v => Math.round(v * 255 * k).toString(16).padStart(2, '0')).join('');
/* Finds places where units on two different walls overlap in the corner (shown in Top view). */
function cornerOverlaps(d){
  if(!d.shape || d.shape === 'single') return [];
  const frames = wallFrames(d.shape, d.walls), rects = [];
  wallsOf(d).forEach(w => { const f = frames[w]; layoutKitchen(d, w).floor.forEach(i => {
    const q = fquad(f, i.x, i.x + i.unit.width, 0, cat(i.unit) === 'base' ? 620 : i.unit.depth), xs = q.map(p => p[0]), ys = q.map(p => p[1]);
    rects.push({w, x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys)}); }); });
  const out = [];
  for(let a = 0; a < rects.length; a++) for(let b = a + 1; b < rects.length; b++){
    const A = rects[a], B = rects[b]; if(A.w === B.w) continue;
    const x0 = Math.max(A.x0, B.x0), x1 = Math.min(A.x1, B.x1), y0 = Math.max(A.y0, B.y0), y1 = Math.min(A.y1, B.y1);

const CORNER_NOTE = 'Units overlap in a corner (shown in red). Leave 600 mm free at the corner end of one wall, or use a corner unit.';

  const ct = CT(d.countertop) || CAT.countertops[0];
  const pts = [];

/* library search: code, Arabic name, category or width (cm or mm); Arabic letters normalised */
const arNorm = t => String(t).toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function libSearch(q){
  const toks = arNorm(q).split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const catOf = u => ['base', 'tall', 'wall', 'acc'].flatMap(l => libCats(l)).filter(c => c.groups.includes(u.group)).map(c => c.label).join(' ');
  return shop(CAT.units).filter(u => { const h = arNorm(`${u.code} ${arName(u)} ${u.name || ''} ${u.group} ${catOf(u)} ${u.width} ${u.width / 10}`); return toks.every(t => h.includes(t)); })
    .sort((a, b) => a.width - b.width || a.code.localeCompare(b.code)).slice(0, 80);
}
const libKeepOpen = () => { try{ return localStorage.getItem('juman.libKeep') === '1'; }catch(e){ return false; } };
function LibResults(){
  const r = libSearch(state.libQuery || '');
  return r.map(ProductCard).join('') || `<p class="lib2-empty">لا توجد وحدات مطابقة لـ «${esc(state.libQuery)}». جرّب اسم الفئة أو المقاس بالسنتيمتر، مثل: مجلى، جوارير، 60.</p>`;
}

  let units = [];

    units = state.favs.map(U).filter(listable);

  <div class="lib2-grid" data-scroll="lib">${q ? LibResults() : state.libLevel === 'island' && !favMode ? Object.values(ISLAND_MODELS).map(IslandCard).join('') : units.map(ProductCard).join('') || `<p class="lib2-empty">${favMode ? 'لا توجد وحدات في المفضلة بعد.' : c && c.pending ? 'هذه الفئة قيد الإعداد. ستظهر الوحدات هنا فور تحديد أبعادها وأسعارها الرسمية.' : 'لا توجد وحدات في هذه الفئة بعد.'}</p>`}</div>

/* Kitchen size: shape + wall lengths in centimetres; applying it resizes the real 3D walls */
function ksStats(d, shape, walls){
  const ks = state.ks || {}, tmp = {...d, shape, walls:{...d.walls, ...Object.fromEntries(Object.entries(walls).map(([k, v]) => [k, v * 10]))},
    offsets:Object.fromEntries(Object.entries(ks.offsets || {}).map(([k, v]) => [k, (Number(v) || 0) * 10]))};
  return SHAPES[shape].walls.map(w => { const f = wallFit(tmp, w); return {w, W:f.W, used:f.used, free:f.free}; });
}

function upsert(arr, orig, rec){
  const i = orig ? arr.findIndex(x => x.code === orig) : -1;

function importCatalog(data){
  const units = Array.isArray(data) ? data : data?.units;
  if(!Array.isArray(units) || !units.length) throw new Error('No units found. Paste a list of units, or an object with a "units" list.');
  const seen = new Set();
  const out = units.map((u, i) => {
    if(!u || !u.code || !u.name) throw new Error(`Unit ${i + 1} needs a code and a name.`);
    if(!(+u.width > 0)) throw new Error(`${u.code}: width must be a number in mm.`);
    const n = normalizeUnit(u);
    if(seen.has(n.code)) throw new Error(`${n.code} appears twice.`);
    seen.add(n.code); return n;
  });
  const next = clone(CAT); next.units = out;
  if(!Array.isArray(data)){
    ['materials','handles','countertops','accessories'].forEach(k => { if(Array.isArray(data[k]) && data[k].length) next[k] = data[k]; });
    if(data.currency) next.currency = data.currency;
  }
  CAT = next; DataService.saveCatalog(CAT); buildDefs();
  return out.length;
}

/* =====================================================================
   FINISH TRIMS / CORNICE BOARDS: 244 cm boards, 2 cm thick. The customer adds each place that needs a trim
   (wall, place, from/to). Runs on the same wall and place that overlap are merged; two runs that meet in a
   room corner stop at each other's cabinet front line (mitred), so no length is counted twice.
   ===================================================================== */
const TRIM_LEN = 2440, TRIM_T = 20;
const TRIM_LOCS = {top:'Top cornice (above the cabinets)', under:'Under the upper cabinets (light rail)', plinth:'Plinth / kickboard', other:'Other place (length only)'};
const TRIM_SHORT = {top:'top cornice', under:'light rail', plinth:'plinth', other:'other'};
function trimUnitsOf(d, w, loc){
  const want = i => loc === 'top' ? (cat(i.unit) === 'wall' || cat(i.unit) === 'tall') : loc === 'under' ? cat(i.unit) === 'wall' : loc === 'plinth' ? (cat(i.unit) === 'base' || (cat(i.unit) === 'tall' && !i.unit.panel && !i.unit.fs)) : false;
  return resolveItems(d, w).filter(i => i.item.x != null && want(i)).map(i => ({x0:i.item.x, x1:i.item.x + i.unit.width, d:i.unit.depth, top:FLOOR - unitBox(i.unit).top, bot:cat(i.unit) === 'wall' ? i.unit._y : 0}));
}
/* front line (mm from the wall) of a trim at one end of a wall: depth of the cabinet nearest that end */
function trimFrontAt(d, w, loc, end){
  const us = trimUnitsOf(d, w, loc).sort((a, b) => end === 'start' ? a.x0 - b.x0 : b.x1 - a.x1);
  if(!us.length) return loc === 'plinth' ? 530 : 350;
  return loc === 'plinth' ? us[0].d - 70 : us[0].d;
}
function cornerPairs(d){
  const fr = wallFrames(d.shape, d.walls), ws = wallsOf(d), out = [];
  for(let i = 0; i < ws.length; i++) for(let j = i + 1; j < ws.length; j++){

/* Maps unit codes from the old demo catalog onto the closest real Juman Home unit (same width), or drops them. */
function migrateUnitCode(code){
  if(U(code)) return code;
  const renamed = {'BS-750':'SINK-750', 'BDW-620':'DW-620', 'BM-750':'MAG-750', 'BC-1000':'CORNER-1000'};
  if(renamed[code] && U(renamed[code])) return renamed[code];
  const pick = (prefix, w) => U(`${prefix}-${w}`) ? `${prefix}-${w}` : null;
  let m;
  if((m = /^B(\d+)-D([234])$/.exec(code))) return pick(`B${m[2]}D`, +m[1]);
  if((m = /^B(\d+)-(2D|SINK|OVEN|DW|CNR)$/.exec(code))) return pick('BD', +m[1]);
  if((m = /^W(\d+)-(1D|2D)$/.exec(code))) return pick('WD35', +m[1]);
  return null;
}

  d.openings.forEach(op => { if(op.sill == null) op.sill = WIN_HEAD - op.height; });   // older windows: top was fixed at 2100 mm

  d.islands = (Array.isArray(d.islands) ? d.islands : []).filter(sl => ISLAND_MODELS[sl?.model] && isFinite(sl.x) && isFinite(sl.z));
  if(!M(d.material)) d.material = M(MAT_MIGRATE[d.material]) ? MAT_MIGRATE[d.material] : CAT.materials[0].code;
  d.items.forEach(i => { if(i.material && !M(i.material)) i.material = M(MAT_MIGRATE[i.material]) ? MAT_MIGRATE[i.material] : null; });

  for(const [a, b] of obs){ if(a - cur >= spec.width - .5) return cur; cur = Math.max(cur, b); }

function alignUnit(it, to){

    const talls = d.items.filter(i => U(i.code) && cat(U(i.code)) === 'tall' && !U(i.code).panel);
    if(!talls.length) return;
    const same = talls.filter(i => wallOf(i) === wallOf(it)).sort((a, b) => Math.abs(a.x - it.x) - Math.abs(b.x - it.x));

document.addEventListener('input', e => {
  if(e.target.dataset.bind === 'name'){ state.design.name = e.target.value; return; }
  const wi = e.target.dataset.wallInput;
  if(wi){
    state.design.walls[wi] = e.target.value === '' ? '' : Number(e.target.value);
    const plan = app.querySelector('[data-plan]'); if(plan) plan.innerHTML = ShapePlan(state.design.shape, state.design.walls, null, 'large');
    const ab = document.getElementById('ab-walls'); if(ab) ab.textContent = wallsText(state.design);
    const er = e.target.form?.querySelector('[data-err]'); if(er) er.textContent = '';
    return;
  }
  const of = e.target.closest('form[data-form="opening"]');
  if(of){ const pv = of.querySelector('[data-op-prev]'); if(pv) pv.innerHTML = OpeningPreview(state.design, readOpening(of)); const rg = of.querySelector('[data-op-range]'); if(rg) rg.textContent = opRangeText(state.design, readOpening(of)); const er = of.querySelector('[data-err]'); if(er) er.textContent = ''; return; }
  const f = e.target.closest('form[data-form="materials"]'); if(f) updateMaterialPreview(f);
  const uf = e.target.closest('form[data-form="units"]');
  if(uf && e.target.name === 'category'){
    const defs = {base:[900,600,'drawers-2'], wall:[800,350,'doors-2'], tall:[2100,560,'tall-pantry']}[e.target.value.toLowerCase()];
    if(defs){ uf.elements.height.value = defs[0]; uf.elements.depth.value = defs[1]; uf.elements.layout.value = defs[2]; }
  }
});
document.addEventListener('change', e => {
  if(e.target.name !== 'imageFile') return;
  const file = e.target.files?.[0], form = e.target.form; if(!file || !form) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 480 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/webp', .85);
      form.dataset.image = url;
      const pv = form.querySelector('[data-img-prev]'); if(pv) pv.innerHTML = `<img src="${url}" alt="">`;
      if(form.dataset.form === 'materials') updateMaterialPreview(form);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(document.querySelector('.modal')) closeModal(); else if(document.querySelector('.rv')) closeRender(); else if(state.selected || state.selOpening){ state.selected = null; state.selOpening = null; render(); } return; }
  if(state.screen !== 'builder' || document.querySelector('.modal') || document.querySelector('.rv')) return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'y')){ e.preventDefault(); (e.key.toLowerCase() === 'y' || e.shiftKey) ? redo() : undo(); return; }
  if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.selected && !state.selOpening){ e.preventDefault(); moveSel(e.key === 'ArrowLeft' ? -1 : 1); return; }
  if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.selOpening){
    e.preventDefault(); const op = (state.design.openings || []).find(x => x.id === state.selOpening);
    if(op && setOpeningLeft(op.id, op.left + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 100 : 10))){ clearTimeout(window._opKeyT); window._opKeyT = setTimeout(() => { render(); overflowCheck(op.wall); }, 350); }
    return;
  }
  if((e.key === 'Delete' || e.key === 'Backspace') && state.selOpening){ e.preventDefault(); actions['opening-delete']({dataset:{}}); return; }
  if((e.key === 'Delete' || e.key === 'Backspace') && state.selected){ e.preventDefault(); removeSel(); }
});

    </div></div><div class="modal-foot"><button class="btn btn-ghost" data-action="copy-json">Copy request data</button><button class="btn btn-ghost" data-action="close-go" data-screen="designs">View my designs</button><button class="btn btn-primary" data-action="close">Done</button></div>`;
    render();
  },
  walls(){ actions['walls-continue'](); },
  ksize(){ applyKitchenSize(); },
  trim(fd, form){
    const d = state.design, w = String(fd.get('wall')), loc = String(fd.get('loc')), W = Number(d.walls[w]) || 0;
    const from = Math.round(Number(fd.get('from')) * 10), to = Math.round(Number(fd.get('to')) * 10), hv = String(fd.get('h') || '').trim(), h = hv === '' ? null : Math.round(Number(hv) * 10);
    state.trimForm = {wall:w, loc};
    if(!TRIM_LOCS[loc] || !wallsOf(d).includes(w)) return showErr(form, 'Choose a wall and a place.');
    if(String(fd.get('from')).trim() === '' || String(fd.get('to')).trim() === '' || !(from >= 0) || !(to > from)) return showErr(form, 'Enter where the trim starts and ends, in cm from the wall start (end after start).');
    if(to > W) return showErr(form, `Wall ${w} is ${cm(W)} long. The trim must end at ${cm(W)} or before.`);
    if(h !== null && !(h >= 10 && h <= 1000)) return showErr(form, 'Board height must be between 1 and 100 cm, or left empty.');
    pushUndo(); d.trims = d.trims || []; d.trims.push({id:'tr' + uid(), wall:w, loc, from, to, h}); refreshTrims();
  },
  opening(fd, form){
    const d = state.design, op = readOpening(form);
    const err = validateOpening(d, op); if(err) return showErr(form, err);
    pushUndo(); d.openings = d.openings || [];
    const i = op.id ? d.openings.findIndex(x => x.id === op.id) : -1;
    if(!op.id) op.id = 'op' + uid();
    if(i >= 0) d.openings[i] = op; else d.openings.push(op);
    d.activeWall = op.wall; state.selected = null; state.selOpening = op.id;
    closeModal(); render(); overflowCheck(op.wall, i >= 0 ? 'Window updated' : 'Window added');
  },
  units(fd, form){
    const orig = fd.get('_orig');
    const code = String(fd.get('code') || '').trim().toUpperCase(), name = String(fd.get('name') || '').trim();
    if(!code || !name) return showErr(form, 'Unit code and name are required.');
    if(!orig && U(code)) return showErr(form, `${code} already exists. Use a new code, or edit the existing unit.`);
    const width = +fd.get('width');
    if(!(width >= 150 && width <= 1200)) return showErr(form, 'Width must be between 150 and 1200 mm.');
    const mats = fd.getAll('materials'), hs = fd.getAll('handles');
    if(!mats.length || !hs.length) return showErr(form, 'Tick at least one material and one handle.');
    const rec = normalizeUnit({code, name, category:fd.get('category'), group:String(fd.get('group') || '').trim(), configuration:String(fd.get('configuration') || '').trim(), width, height:+fd.get('height'), depth:+fd.get('depth'),
      price:String(fd.get('price') ?? '').trim() === '' ? null : Math.round((+fd.get('price') || 0) * 100) / 100, priceStatus:fd.get('realPrice') ? 'real' : 'placeholder', layout:fd.get('layout'),
      materials: mats.length === CAT.materials.length ? [] : mats, handles: hs.length === CAT.handles.length ? [] : hs,
      asset:String(fd.get('asset') || `assets/units/${code.toLowerCase()}.glb`), image:form.dataset.image || '', status:fd.get('status')});
    upsert(CAT.units, orig, rec); DataService.saveCatalog(CAT); state.adminView = code; closeModal(); render();
    toast(orig ? `${code} updated` : `${code} added to the unit library`);
  },
  materials(fd, form){
    const orig = fd.get('_orig');
    const code = String(fd.get('code') || '').trim().toUpperCase(), name = String(fd.get('name') || '').trim();
    if(!code || !name) return showErr(form, 'Material code and name are required.');
    if(!orig && M(code)) return showErr(form, `${code} already exists. Use a new code.`);
    const type = fd.get('type') === 'solid' ? 'solid' : 'wood';
    const m = {code, name, type, category:String(fd.get('category') || '').trim() || (type === 'wood' ? 'Wood veneer' : 'Matt lacquer'), texture:fd.get('texture'), textureImage:form.dataset.image || (orig ? (M(orig)?.textureImage || '') : ''), base:fd.get('base'), grain:fd.get('grain'), priceMultiplier:+fd.get('priceMultiplier') || 1, availableUnits: fd.get('allUnits') ? [ALL] : [], status:fd.get('status')};
    if(!orig) Object.assign(m, {sheen:.6, preview:`assets/materials/${code.toLowerCase()}.webp`});
    upsert(CAT.materials, orig, m); DataService.saveCatalog(CAT); buildDefs(); state.adminView = code; closeModal(); render(); toast(orig ? `${name} updated` : `${name} added to materials`);
  },
  handles(fd, form){
    const orig = fd.get('_orig');
    const code = String(fd.get('code') || '').trim().toUpperCase(), name = String(fd.get('name') || '').trim();
    if(!code || !name) return showErr(form, 'Handle code and name are required.');
    if(!orig && H(code)) return showErr(form, `${code} already exists. Use a new code.`);
    const h = {code, name, style:fd.get('style'), finish:String(fd.get('finish') || 'Custom'), light:fd.get('light'), dark:fd.get('dark'), length:+fd.get('length') || 160, price:+fd.get('price') || 0, status:fd.get('status')};
    upsert(CAT.handles, orig, h); DataService.saveCatalog(CAT); buildDefs(); state.adminView = code; closeModal(); render(); toast(orig ? `${code} updated` : `${code} added to handles`);
  },
  countertops(fd, form){
    const orig = fd.get('_orig');
    const code = String(fd.get('code') || '').trim().toUpperCase(), name = String(fd.get('name') || '').trim();
    if(!code || !name) return showErr(form, 'Countertop code and name are required.');
    if(!orig && CT(code)) return showErr(form, `${code} already exists. Use a new code.`);
    const c = {code, name, type:fd.get('type'), color:fd.get('color'), vein:fd.get('vein'), pricePerMeter:+fd.get('pricePerMeter') || 0, status:fd.get('status')};
    upsert(CAT.countertops, orig, c); DataService.saveCatalog(CAT); buildDefs(); state.adminView = code; closeModal(); render(); toast(orig ? `${name} updated` : `${name} added to countertops`);
  }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const h = formHandlers[f.dataset.form]; if(h) h(new FormData(f), f);
});

/* boot */
(function boot(){
  const t = DataService.getTheme(); if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  buildDefs();
  render();
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if(!document.documentElement.dataset.theme) render(); });
})();
</script>

/* installable app: register the service worker (works on https and localhost) */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
document.documentElement.classList.toggle('standalone', matchMedia('(display-mode: standalone)').matches || navigator.standalone === true);
